name: Update EPIC6 documentation

on:
  schedule:
    - cron: '0 0 * * 1'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Copilot credentials
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          if [ -z "$COPILOT_TOKEN" ]; then
            echo "::error::Add the COPILOT_TOKEN Actions secret with Agent tasks read/write access to this repository."
            exit 1
          fi

      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Start Copilot task
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.COPILOT_TOKEN }}
          retries: 0
          script: |
            const { readFile } = require('node:fs/promises');
            const prompt = await readFile('EPIC-UPDATE-PROMPT', 'utf8');
            if (!prompt.trim()) {
              throw new Error('EPIC-UPDATE-PROMPT is empty.');
            }

            const { owner, repo } = context.repo;
            const { data: task } = await github.request('POST /agents/repos/{owner}/{repo}/tasks', {
              owner,
              repo,
              prompt,
              base_ref: context.payload.repository.default_branch,
              create_pull_request: true,
              headers: {
                'X-GitHub-Api-Version': '2026-03-10'
              }
            });

            core.notice(`Copilot task created: ${task.html_url}`);
            await core.summary.addLink('View Copilot task', task.html_url).write();
